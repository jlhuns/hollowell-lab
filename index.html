<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>Hollowell Laboratory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
  /* Layout: one-screen app. A gaslit header bar, then either the 3D laboratory or a stack of evidence cards. */
  :root {
    --bg: #15110e;          /* lamp-black umber */
    --panel: #221b16;       /* panelled oak in shadow */
    --line: #3a2f26;
    --fg: #ece2d0;          /* candle-lit text */
    --muted: #a8998a;
    --brass: #c9a24a;       /* the machine's brass */
    --blood: #b5473a;
    --moon: #8fb6d4;        /* storm light through the window */
    --paper: #ebe1c9;       /* evidence card */
    --ink: #2b2119;
    --paper-muted: #6e5f4f;
    --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --f-body: "Spectral", Georgia, "Times New Roman", serif;
    --f-type: "Courier Prime", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; display: flex; flex-direction: column; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

  header { background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
  .titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  h1 em { color: var(--brass); font-style: italic; }
  .date { font-family: var(--f-type); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: 600 .82rem/1 var(--f-body); color: var(--muted); background: transparent; border: 0; padding: 8px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brass); color: var(--bg); }
  .seg button:focus-visible, .btn:focus-visible, .spot:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
  .seg button .lock { font-size: .7rem; opacity: .8; }

  main { flex: 1; position: relative; min-height: 0; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }

  .hud { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .views { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { font: 600 .8rem/1 var(--f-body); color: var(--fg); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; backdrop-filter: blur(4px); }
  .btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  .btn.look { border-color: var(--moon); color: var(--moon); }
  .height { position: absolute; right: 0; bottom: calc(100% + 12px); display: grid; justify-items: center; gap: 6px; }
  .height[hidden] { display: none; }
  .height .btn { width: 44px; height: 44px; padding: 0; font-size: 1rem; touch-action: none; user-select: none; -webkit-user-select: none; }
  .height span, .stick span { font: 700 .62rem/1 var(--f-type); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stick { position: absolute; left: 0; bottom: calc(100% + 12px); width: 112px; height: 112px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 55%, transparent); backdrop-filter: blur(4px); touch-action: none; user-select: none; -webkit-user-select: none; display: grid; place-items: center; }
  .stick[hidden] { display: none; }
  .stick span { position: absolute; bottom: -16px; }
  .knob { width: 48px; height: 48px; border-radius: 50%; background: var(--panel); border: 1px solid var(--brass); box-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; }
  .hint { transition: opacity .6s; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-family: var(--f-type); font-size: .72rem; letter-spacing: .08em; color: var(--muted); background: color-mix(in srgb, var(--bg) 70%, transparent); padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

  /* labels in the 3D view */
  .spot { pointer-events: auto; font: 700 .72rem/1 var(--f-type); letter-spacing: .04em; color: var(--ink); background: var(--paper); border: 1px solid var(--brass); border-radius: 999px; padding: 6px 9px 6px 6px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); white-space: nowrap; }
  .spot b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--blood); color: var(--paper); font-size: .7rem; }
  .who { font: 600 .7rem/1.1 var(--f-body); color: var(--fg); background: color-mix(in srgb, var(--bg) 80%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; white-space: nowrap; }
  .who b { color: var(--brass); margin-right: 3px; }
  .who.gap { border-style: dashed; color: var(--moon); }
  body.far .spot span, body.far .who span { display: none; }
  body.far .spot { padding: 4px; }
  body.far .who b { margin: 0; }

  /* evidence */
  #evidence { position: absolute; inset: 0; overflow-y: auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stack { max-width: 680px; margin: 0 auto; display: grid; gap: 22px; }
  .roundhead { font-family: var(--f-type); font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); display: flex; align-items: center; gap: 10px; }
  .roundhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .card { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 18px 18px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35); min-width: 0; }
  .card .tag { font: 700 .7rem/1 var(--f-type); letter-spacing: .14em; text-transform: uppercase; color: var(--blood); }
  .card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 6px 0 8px; text-wrap: balance; }
  .card p { margin: 0 0 8px; line-height: 1.5; }
  .card ul { margin: 0 0 8px; padding-left: 20px; line-height: 1.45; }
  .card .note { font-style: italic; color: var(--paper-muted); font-size: .92rem; }
  .card .script { font-family: var(--f-type); font-size: .86rem; background: rgba(43,33,25,.07); padding: 8px 10px; border-left: 3px solid var(--brass); }
  .card img { display: block; width: 100%; border: 1px solid #cbbd9f; margin: 6px 0 8px; }
  .legend { columns: 2; column-gap: 18px; font-size: .85rem; margin: 0 0 8px; padding: 0; list-style: none; }
  .card .view { font: 600 .8rem/1 var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 6px; padding: 7px 10px; cursor: pointer; margin-top: 4px; }
  .sealed { border: 1px dashed var(--line); border-radius: 6px; padding: 16px; color: var(--muted); font-style: italic; text-align: center; }

  /* bottom sheet and gate */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.55) 40px); z-index: 5; }
  .sheet .card { max-width: 560px; margin: 0 auto; position: relative; }
  .sheet .close { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; font: 700 1.2rem/1 var(--f-body); color: var(--ink); cursor: pointer; padding: 4px 8px; }
  .gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,8,6,.8); z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .gate .card { max-width: 380px; text-align: center; }
  .gate .row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .gate .row button { font: 600 .9rem/1 var(--f-body); padding: 10px 14px; border-radius: 6px; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); }
  .gate .row button.go { background: var(--ink); color: var(--paper); }
  .err { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  @media (max-width: 520px) { h1 { font-size: 1.2rem; } .date { display: none; } .btn { padding: 8px 9px; font-size: .76rem; } }
</style>
</head>
<body>


<header>
  <div class="titlerow">
    <h1>Hollowell's <em>Laboratory</em></h1>
    <span class="date">Hollowell Manor &middot; 31 Oct 1888</span>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="View">
      <button id="tab-scene" aria-pressed="true">The scene</button>
      <button id="tab-evidence" aria-pressed="false">Evidence</button>
    </div>
    <div class="seg" role="group" aria-label="Round">
      <button data-round="1" aria-pressed="true">Round 1</button>
      <button data-round="2" aria-pressed="false">Round 2</button>
      <button data-round="3" aria-pressed="false">Round 3</button>
    </div>
  </div>
</header>

<main>
  <div id="scene"></div>
  <div id="labels"></div>
  <div class="hint" id="hint">Drag to look around &middot; pinch to zoom &middot; tap a label</div>
  <div class="hud" id="hud">
    <div class="views" id="orbit-views">
      <button class="btn" data-view="overview">Overview</button>
      <button class="btn" data-view="rail">From the rail</button>
      <button class="btn" data-view="table">His table</button>
      <button class="btn" data-view="desk">Desk &amp; machine</button>
    </div>
    <div class="views" id="look-views" hidden>
      <button class="btn" data-station="rail">At the rail</button>
      <button class="btn" data-station="machine">By the machine</button>
      <button class="btn" data-station="door">Doorway</button>
      <button class="btn" data-station="window">By the window</button>
    </div>
    <div class="views">
      <button class="btn" id="btn-pos" aria-pressed="false" hidden>Positions at the flash</button>
      <button class="btn look" id="btn-look">Look around</button>
    </div>
    <div class="stick" id="stick" hidden aria-label="Walk: drag the knob"><div class="knob" id="knob"></div><span>Walk</span></div>
    <div class="height" id="height" hidden>
      <button class="btn" data-climb="1" aria-label="Raise your view">&#9650;</button>
      <span>Height</span>
      <button class="btn" data-climb="-1" aria-label="Lower your view">&#9660;</button>
    </div>
  </div>
  <div id="evidence" hidden><div class="stack" id="stack"></div></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="gate" id="gate" hidden></div>
  <div class="err" id="err" hidden>The 3D scene couldn't start on this device. The Evidence tab still works.</div>
</main>

<script>window.EVIDENCE = [{"n": 1, "round": 1, "title": "The lever", "paras": ["The machine's lever stands at FULL. Its dial reads OFF · SPARK · FULL. It's stiff and couldn't have slipped; someone pushed it. The brass handle is scorched, smeared with grey powder, and a strand of gauze is caught on the lever's hinge."], "items": [], "legend": [], "notes": []}, {"n": 2, "round": 1, "title": "The gas valve", "paras": ["The valve by the door that feeds every lamp in the lab was closed by hand. The storm didn't put the lamps out."], "items": [], "legend": [], "notes": []}, {"n": 3, "round": 1, "title": "The open window", "paras": ["The creation's table is empty, its sheet on the floor. Bare, muddy footprints lead from the table to the machine, then along the walkway to the open window."], "items": [], "legend": [], "notes": []}, {"n": 4, "round": 2, "title": "Dr. Lark's examination", "paras": ["A heavy blow to the back of the skull from a rounded object, struck from behind. The burns on his hands barely blistered, so his heart had already stopped when the current hit. The blow killed him. The burns were added afterwards. His right fist is clenched around a few links of fine gold chain, snapped at both ends."], "items": [], "legend": [], "notes": ["Read by Dr. Lark · Prop: chain fragment"]}, {"n": 5, "round": 2, "title": "Quill's photograph", "paras": ["Taken by magnesium flash on the word \"Rise!\", an instant before the lamps died. The constable has sketched everyone's position from the plate. On the plate itself you can see:"], "items": ["Lady Ashworth at Viktor's right shoulder, her gloved hand resting on the machine beside the brass sphere.", "Professor Crane bent over the open journal at the desk, one bare hand flat on a page.", "A shadow behind Fenwick's screen, and the sheeted figure on the creation's table.", "A gap at the rail beside Miss Wren, next to the open gate."], "legend": ["1 Dr. Hollowell, the victim", "2 Lady Ashworth", "3 Professor Crane", "4 A shadow behind the screen", "5 The sheeted figure", "6 Grimsby", "7 Mrs. Pike", "8 An empty gap", "9 Miss Wren", "10 Madame Thrale", "11 Reverend Edmund", "12 Kit Ludlow", "13 Vane", "14 Dr. Lark", "15 Rosalind"], "notes": ["This sketch shows where everyone stood at the instant of the flash, just before the dark. Where anyone went after that is for you to work out.", "The sketch marks the cables: inside the rail they cover the floor everywhere except the north walkway.", "Presented by Quill"]}, {"n": 6, "round": 2, "title": "The journal pages", "paras": ["Torn from Viktor's journal and found in Professor Crane's coat. The last entry: \"The creation will not live. Very well. I shall give them a performance instead.\"", "RISE! · Q. flash. G. closes the gas, counts thirty aloud. F. blue glow. S. sits up. Lever to SPARK only. NEVER FULL.", "In the margin: \"C. in the corridor again during rehearsal.\"", "Beneath the pages on the desk: a new will in Viktor's hand, leaving everything to Lady Ashworth \"upon our marriage.\" It is unsigned. Until it is signed, the old will stands, and Rosalind inherits everything."], "items": [], "legend": [], "notes": []}, {"n": 7, "round": 3, "title": "The gloves", "paras": ["Found when my constables emptied the water bucket beside the machine: a pair of cream kid gloves with pearl buttons at the wrist. The right palm is scorched through. One pearl button is missing from the left cuff. Matching scorched cream threads are stuck to the lever handle. Whoever pushed the lever to FULL was wearing these."], "items": [], "legend": [], "notes": ["Prop: cream gloves, one palm browned with marker"]}, {"n": 8, "round": 3, "title": "The brass sphere", "paras": ["The heavy brass sphere on top of the machine sits loose on a worn thread and lifts straight off. Underneath: blood and one of Viktor's own grey hairs. It was put back crooked. Grimsby's oily thumbprints are all over the brass. Professor Crane's walking stick has been examined under a lens: no blood, no hair, not a dent. It was not the weapon."], "items": [], "legend": [], "notes": []}, {"n": 9, "round": 3, "title": "The locket", "paras": ["Under Viktor's table: a gold locket, its chain snapped. Its links are twisted rope-chain and match the ones in Viktor's fist. Professor Crane's broken pince-nez chain is plain flat links. Inside, a faded photograph of two children, an older girl and a little one, engraved \"E. & L. · always.\""], "items": [], "legend": [], "notes": ["Prop: a cheap locket with a tiny printed photo"]}]; window.SKETCH = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCALoBEwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6RooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAoo let tween = null;
const portrait = () => camera.aspect < .8;
function viewOf(name) { if (name === "overview" && portrait()) return [new THREE.Vector3(0, 19, 13), new THREE.Vector3(0, 0, -.8)]; return VIEWS[name]; }
function goView(name) { const [p, t] = viewOf(name); tween = { p: p.clone(), t: t.clone() }; if (reduce) { camera.position.copy(p); controls.target.copy(t); tween = null; } }
function focusSpot(n) { const s = spots[n]; if (!s) return; const t = s.position.clone(); t.y = Math.min(t.y, 1.2); const off = new THREE.Vector3(2.6, 2.6, 3.4); tween = { p: t.clone().add(off), t }; if (reduce) { camera.position.copy(tween.p); controls.target.copy(t); tween = null; } setTimeout(() => openSheet(n), reduce ? 0 : 650); }

function setPositions(on) { showPositions = on; $("#btn-pos").setAttribute("aria-pressed", on); for (const o of people) o.visible = on; }
$("#btn-pos").onclick = () => setPositions(!showPositions);

function applyRound() {
  if (!world) return;
  for (const [o, from, to] of byRound) o.visible = round >= from && round <= to;
  for (const n in spots) spots[n].visible = round >= spots[n].userData.from;
  // Evidence 8: found crooked once the sphere is examined
  if (round >= 3) { sphere.position.x = P(271, 0).x + .1; sphere.rotation.z = .35; sphere.position.y = 2.15; } else { sphere.position.x = P(271, 0).x; sphere.rotation.z = 0; sphere.position.y = 2.18; }
}

function start() {
  const host = $("#scene");
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.45;
  host.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer(); $("#labels").appendChild(labelRenderer.domElement);
  camera = new THREE.PerspectiveCamera(50, 1, .1, 100);
  build();
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = 1.45; controls.minDistance = 2; controls.maxDistance = 30;
  controls.addEventListener("start", () => { tween = null; $("#hint").style.opacity = 0; });
  const size = () => { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h); labelRenderer.setSize(w, h); camera.aspect = w / h; camera.fov = look ? 72 : w < h ? 62 : 48; camera.updateProjectionMatrix(); };
  resizeView = size;
  new ResizeObserver(size).observe(host); size();
  { const [p0, t0] = viewOf("overview"); camera.position.copy(p0); controls.target.copy(t0); }
  applyRound();
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    if (!reduce) flicker.forEach((L, i) => L.intensity = 16 + Math.sin(t * 7 + i * 2) * .8 + Math.sin(t * 13.3 + i) * .5);
    if (tween) { camera.position.lerp(tween.p, .08); controls.target.lerp(tween.t, .08); if (camera.position.distanceTo(tween.p) < .02) tween = null; }
    if (look) { lookUpdate(); document.body.classList.remove("far"); }
    else { controls.update(); document.body.classList.toggle("far", camera.position.distanceTo(controls.target) > 9); }
    renderer.render(scene, camera); labelRenderer.render(scene, camera);
  });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => goView(b.dataset.view));
  setupLook();
  setTimeout(() => { $("#hint").style.opacity = 0; }, 6000);
}

// ---------- Look around: stand inside the lab; the phone's motion turns your view ----------
// [stand x, stand y, look toward x, look toward y] in sketch units
const STATIONS = { rail: [330, 362, 330, 150], machine: [300, 90, 380, 230], door: [52, 360, 330, 220], window: [616, 236, 330, 200] };
const EYE = 1.6, UP = new THREE.Vector3(0, 1, 0), ZEE = new THREE.Vector3(0, 0, 1);
const Q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5)), qTmp = new THREE.Quaternion(), qDev = new THREE.Quaternion(), qYaw = new THREE.Quaternion();
const eDev = new THREE.Euler(), eMan = new THREE.Euler();
let look = false, gyro = false, dev = null, yawOffset = 0, needAlign = false, yaw = 0, pitch = 0, wantYaw = 0, resizeView = () => {}, hintTimer;
let eye = EYE, climb = 0;                // eye height in metres; climb is +1/-1 while a height button is held
const setEye = h => { eye = Math.max(.3, Math.min(3.2, h)); };
// walking: the thumbstick (or WASD / arrow keys) moves you, kept inside the walls
const walk = { x: 0, y: 0 }, keys = new Set();
const BOUNDS = [P(20, 0).x + .25, P(660, 0).x - .25, P(0, 30).z + .25, P(0, 440).z - .25];
let lastT = 0;
const key = (...k) => k.some(n => keys.has(n)) ? 1 : 0;
const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ } };

addEventListener("deviceorientation", e => { if (e.alpha !== null) dev = { a: e.alpha, b: e.beta, g: e.gamma }; });
function deviceQuat(o) {
  const orient = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  eDev.set(THREE.MathUtils.degToRad(o.b), THREE.MathUtils.degToRad(o.a), -THREE.MathUtils.degToRad(o.g), "YXZ");
  return qDev.setFromEuler(eDev).multiply(Q1).multiply(qTmp.setFromAxisAngle(ZEE, -orient));
}
const yawOf = q => { const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q); return Math.atan2(-f.x, -f.z); };
function setHint(text) { const h = $("#hint"); h.textContent = text; h.style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => h.style.opacity = 0, 5000); }

function goStation(name) {
  const [x, y, tx, ty] = STATIONS[name];
  camera.position.copy(P(x, y, EYE));
  const d = P(tx, ty, EYE).sub(camera.position);
  wantYaw = Math.atan2(-d.x, -d.z); yaw = wantYaw; pitch = -.12; needAlign = true; eye = EYE;
  document.querySelectorAll("[data-station]").forEach(b => b.setAttribute("aria-pressed", b.dataset.station === name));
}
function lookUpdate() {
  const now = performance.now(), dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (gyro && dev) {
    const q = deviceQuat(dev);
    if (needAlign) { yawOffset = wantYaw - yawOf(q); needAlign = false; }
    camera.quaternion.copy(qYaw.setFromAxisAngle(UP, yawOffset)).multiply(q);
  } else camera.quaternion.setFromEuler(eMan.set(pitch, yaw, 0, "YXZ"));
  // walk toward wherever you are facing (level with the floor)
  const mx = Math.max(-1, Math.min(1, walk.x + key("d", "arrowright") - key("a", "arrowleft")));
  const my = Math.max(-1, Math.min(1, walk.y + key("w", "arrowup") - key("s", "arrowdown")));
  if (mx || my) {
    const a = yawOf(camera.quaternion), step = 1.5 * dt, p = camera.position;
    p.x = Math.max(BOUNDS[0], Math.min(BOUNDS[1], p.x + (-Math.sin(a) * my + Math.cos(a) * mx) * step));
    p.z = Math.max(BOUNDS[2], Math.min(BOUNDS[3], p.z + (-Math.cos(a) * my - Math.sin(a) * mx) * step));
    document.querySelectorAll("[data-station]").forEach(b => b.setAttribute("aria-pressed", false));
  }
  if (climb) setEye(eye + climb * 1.2 * dt);
  camera.position.y = eye;
}
async function enterLook() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try { gyro = (await DeviceOrientationEvent.requestPermission()) === "granted"; } catch { gyro = false; }
  } else gyro = matchMedia("(pointer: coarse)").matches;
  look = true; tween = null; controls.enabled = false;
  lookOnly.forEach(o => o.visible = true);
  $("#orbit-views").hidden = true; $("#look-views").hidden = false; $("#height").hidden = false; $("#stick").hidden = false; $("#btn-look").textContent = "Back to the model";
  resizeView(); goStation("rail"); lastT = performance.now();
  setHint(gyro ? "Thumbstick to walk \u00B7 move your phone to look" : "Thumbstick or WASD to walk \u00B7 drag to look");
  setTimeout(() => { if (look && gyro && !dev) { gyro = false; setHint("Thumbstick to walk \u00B7 drag to look"); } }, 1500);
}
function exitLook() {
  look = false; climb = 0; walk.x = walk.y = 0; keys.clear(); controls.enabled = true;
  lookOnly.forEach(o => o.visible = false);
  $("#orbit-views").hidden = false; $("#look-views").hidden = true; $("#height").hidden = true; $("#stick").hidden = true; $("#btn-look").textContent = "Look around";
  resizeView(); const [p0, t0] = viewOf("overview"); camera.position.copy(p0); controls.target.copy(t0);
}
function setupLook() {
  $("#btn-look").onclick = () => look ? exitLook() : enterLook();
  document.querySelectorAll("[data-station]").forEach(b => b.onclick = () => goStation(b.dataset.station));
  const el = renderer.domElement; let drag = null;
  el.addEventListener("pointerdown", e => { if (!look) return; drag = { x: e.clientX, y: e.clientY }; capture(el, e); });
  el.addEventListener("pointermove", e => {
    if (!look || !drag) return;
    const dx = (e.clientX - drag.x) * .005, dy = (e.clientY - drag.y) * .005; drag = { x: e.clientX, y: e.clientY };
    // with phone motion the tilt already looks up and down, so a vertical drag raises or lowers you instead
    if (gyro && dev) { yawOffset += dx; setEye(eye + dy * 1.2); } else { yaw += dx; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy)); }
  });
  el.addEventListener("pointerup", () => drag = null); el.addEventListener("pointercancel", () => drag = null);
  document.querySelectorAll("[data-climb]").forEach(b => {
    b.addEventListener("pointerdown", e => { e.preventDefault(); climb = +b.dataset.climb; capture(b, e); });
    for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(ev, () => climb = 0);
    b.addEventListener("contextmenu", e => e.preventDefault());
  });
  const stick = $("#stick"), knob = $("#knob"), R = 40;
  const moveStick = e => {
    const r = stick.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy); if (len > R) { dx *= R / len; dy *= R / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`; walk.x = dx / R; walk.y = -dy / R;
  };
  let stickId = null;
  const stopStick = e => { if (e.pointerId !== stickId) return; stickId = null; walk.x = walk.y = 0; knob.style.transform = ""; };
  stick.addEventListener("pointerdown", e => { e.preventDefault(); stickId = e.pointerId; capture(stick, e); moveStick(e); });
  stick.addEventListener("pointermove", e => { if (e.pointerId === stickId) moveStick(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) stick.addEventListener(ev, stopStick);
  addEventListener("keydown", e => { if (look && /^(w|a|s|d|arrow(up|down|left|right))$/.test(e.key.toLowerCase())) { keys.add(e.key.toLowerCase()); e.preventDefault(); } });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
}

// Builds the AR file for a round (used once, offline, to make ar/round-N.usdz)
async function exportRound(r) {
  const keep = { round, pos: showPositions };
  round = r; applyRound(); setPositions(r >= 2);
  arOnly.forEach(([o, from, to]) => o.visible = r >= from && r <= to);
  const { USDZExporter } = await import("three/addons/exporters/USDZExporter.js");
  const model = new THREE.Group(); const clone = world.clone(true); const c = P(340, 235); clone.position.set(-c.x, 0, -c.z); model.add(clone);
  const data = await new USDZExporter().parse(model, { quickLookCompatible: true });
  arOnly.forEach(([o]) => o.visible = false);
  round = keep.round; applyRound(); setPositions(keep.pos);
  return data;
}
function previewAR(r) { round = r; applyRound(); setPositions(r >= 2); arOnly.forEach(([o, from, to]) => o.visible = r >= from && r <= to); }
window.__hollowell = { exportRound, previewAR };

try { start(); } catch (e) { console.error(e); $("#err").hidden = false; $("#hud").hidden = true; $("#hint").hidden = true; }
setRound(round);
setTab(store.get("hollowell-tab", "scene"));
</script>
